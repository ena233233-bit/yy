<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17131f">
<title>暑假最后三天 · 序章</title>
<style>
:root{--ink:#fff;--muted:#d8d0e2;--panel:rgba(17,13,24,.84);--line:rgba(255,255,255,.18);--pink:#ff8fbe;--violet:#9485ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0b11;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}.game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#19141f}
.bg,.bg-fallback{position:absolute;inset:0;width:100%;height:100%}.bg{object-fit:cover;object-position:center;transition:opacity .25s ease;filter:brightness(.98) saturate(.95)}
.bg-fallback{display:grid;place-items:center;background:linear-gradient(145deg,#2b2433,#17131d);color:rgba(255,255,255,.14);font-weight:900;letter-spacing:.12em}
.vignette{position:absolute;z-index:5;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,0) 56%,rgba(0,0,0,.34));pointer-events:none}
.sprites{position:absolute;z-index:10;inset:0 0 118px;pointer-events:none;overflow:hidden}
.sprite{position:absolute;bottom:-2vh;height:84vh;max-width:52vw;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.34));transition:opacity .18s ease,transform .2s ease,left .2s ease,right .2s ease}
.sprite[data-char="fy"]{height:77vh}.sprite[data-char="gg"]{height:82vh}.sprite.left{left:0}.sprite.center{left:50%;transform:translateX(-50%)}.sprite.right{right:0}.sprite.hidden{opacity:0;visibility:hidden}
.sprite-fallback{display:none}
.topbar{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.timecard,.topbtn{border:1px solid var(--line);background:rgba(10,8,14,.62);backdrop-filter:blur(8px)}.timecard{padding:7px 11px;border-radius:999px;font-size:11px;color:var(--muted)}
.actions{display:flex;gap:6px}.topbtn{height:34px;min-width:38px;border-radius:10px;cursor:pointer}
.textbox{position:absolute;z-index:30;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));min-height:116px;padding:20px 16px 13px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 16px 38px rgba(0,0,0,.34);cursor:pointer}
.name{position:absolute;left:16px;top:-17px;min-width:78px;padding:7px 12px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--violet));font-weight:900;text-align:center}
.dialogue{min-height:56px;font-size:clamp(16px,2.3vw,20px);line-height:1.62;text-shadow:0 1px 2px #000}.hint{position:absolute;right:13px;bottom:7px;color:var(--muted);font-size:10px}
/* CG 放在背景层之上、对话框之下，CG 时仍能正常读台词 */
.cg{position:absolute;z-index:12;inset:0;display:flex;align-items:center;justify-content:center;background:#050407;transition:opacity .25s ease}.cg.hidden{display:none}.cg img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.cg-label{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.38);font-weight:900}
.endcard{position:absolute;z-index:55;inset:0;display:none;place-items:center;padding:20px;background:rgba(8,6,11,.92);backdrop-filter:blur(10px)}.endcard.show{display:grid}.endinner{text-align:center;max-width:500px}.endinner h1{margin:0 0 8px;font-size:clamp(30px,7vw,54px)}.endinner p{color:var(--muted);line-height:1.7}.restart{margin-top:12px;padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);cursor:pointer}
.toast{position:absolute;z-index:70;left:50%;top:70px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.72);font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:700px){.sprites{inset-bottom:112px}.sprite{bottom:-1vh;max-width:53vw}.sprite[data-char="fy"]{height:70vh;right:-2vw}.sprite[data-char="gg"]{height:76vh;left:-1vw}.textbox{left:10px;right:10px;min-height:112px;padding:20px 15px 12px}.dialogue{font-size:16px;line-height:1.58}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="bg-fallback" id="bgFallback">BACKGROUND</div><img class="bg" id="bg" alt="背景"><div class="vignette"></div>
  <div class="sprites"><div id="phLeft" class="sprite-fallback"></div><div id="phCenter" class="sprite-fallback"></div><div id="phRight" class="sprite-fallback"></div><img id="spriteLeft" class="sprite left hidden" alt="左侧立绘"><img id="spriteCenter" class="sprite center hidden" alt="中间立绘"><img id="spriteRight" class="sprite right hidden" alt="右侧立绘"></div>
  <div class="topbar"><div class="timecard" id="timecard">8月 · 暑假结束前三天</div><div class="actions"><button class="topbtn" id="saveBtn" type="button">💾</button><button class="topbtn" id="skipBtn" type="button">»</button></div></div>
  <div class="textbox" id="textbox"><div class="name" id="name">旁白</div><div class="dialogue" id="dialogue"></div><div class="hint">点击继续 ▶</div></div>
  <div class="cg hidden" id="cg"><div class="cg-label" id="cgLabel">CG · 夜路加载失败</div><img id="cgImage" alt="GG与Fy走夜路CG"></div>
  <div class="endcard" id="endcard"><div class="endinner"><h1>序章 · 1 END</h1><p>暑假还剩下三天。<br>对GG来说，这一天和平常没有任何不同。</p><button class="restart" id="restartBtn" type="button">重新开始</button></div></div><div class="toast" id="toast"></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), V='?v=20260817b';
const A={
 bg:{room:'assets/bg-room.jpg'+V,living:'assets/bg-living.jpg'+V},
 sp:{
  /* GG 高清拆图还没进仓库，先统一使用现有可显示版本，避免反复404导致更糊/闪烁 */
  ggSmile:'assets/gg-sprite-test.webp'+V,ggSad:'assets/gg-sprite-test.webp'+V,ggAngry:'assets/gg-sprite-test.webp'+V,ggNeutral:'assets/gg-sprite-test.webp'+V,
  fySmile:'assets/fy-smile.png'+V,fyWorry:'assets/fy-neutral.png'+V,fyNeutral:'assets/fy-neutral.png'+V,fyFlat:'assets/fy-neutral.png'+V
 },
 cg:{night:'assets/cg-nightwalk.jpg'+V}
};
const story=[
 {t:'8月 · 暑假结束前三天 · 12:00',bg:'room',n:'旁白',x:'正午的光已经从窗帘缝里钻进来很久了。房间里却还是安静得像清晨。'},
 {bg:'room',n:'旁白',x:'衣服、零食袋和不知道什么时候掉到地上的东西堆得到处都是。床上的人完全没有要醒的意思。'},
 {bg:'room',n:'Fy',x:'GG。起床了。',sp:{r:'fySmile'}},
 {bg:'room',n:'GG',x:'……嗯。',sp:{l:'ggSad',r:'fySmile'}},
 {bg:'room',n:'Fy',x:'不是“嗯”。已经十二点了。',sp:{l:'ggSad',r:'fyFlat'}},
 {bg:'room',n:'GG',x:'十二点也算早。暑假又不用上学。',sp:{l:'ggNeutral',r:'fyFlat'}},
 {bg:'room',n:'Fy',x:'再过三天就开学了。你准备一直睡到开学当天吗？',sp:{l:'ggNeutral',r:'fySmile'}},
 {bg:'room',n:'GG',x:'可以考虑。',sp:{l:'ggSmile',r:'fySmile'}},
 {bg:'room',n:'Fy',x:'不可以。还有，你的书包收了吗？',sp:{l:'ggSmile',r:'fyFlat'}},
 {bg:'room',n:'GG',x:'……书包不是一直都在那里吗。',sp:{l:'ggNeutral',r:'fyFlat'}},
 {bg:'room',n:'Fy',x:'“在那里”和“收好了”是两回事。',sp:{l:'ggNeutral',r:'fyWorry'}},
 {bg:'room',n:'旁白',x:'Fy看了一眼地面，又看了一眼床。沉默了两秒。'},
 {bg:'room',n:'Fy',x:'先起来。至少先吃饭。',sp:{l:'ggSad',r:'fySmile'}},
 {bg:'room',n:'GG',x:'你做？',sp:{l:'ggSmile',r:'fySmile'}},
 {bg:'room',n:'Fy',x:'不然呢？让你自己做，我怕厨房比这个房间还惨。',sp:{l:'ggAngry',r:'fySmile'}},
 {t:'12:18 · 客厅',bg:'living',n:'旁白',x:'十几分钟后，GG终于被Fy从床上弄了起来。锅里的水咕嘟咕嘟冒着泡。',sp:{l:'ggNeutral',r:'fyNeutral'}},
 {bg:'living',n:'GG',x:'其实泡面我还是会的。',sp:{l:'ggNeutral',r:'fyNeutral'}},
 {bg:'living',n:'Fy',x:'把开水倒进去不叫会做饭。',sp:{l:'ggAngry',r:'fySmile'}},
 {bg:'living',n:'GG',x:'能吃就行。',sp:{l:'ggNeutral',r:'fySmile'}},
 {bg:'living',n:'Fy',x:'你上次也是这么说，然后拿薯片当晚饭。',sp:{l:'ggSad',r:'fyWorry'}},
 {bg:'living',n:'GG',x:'那天不饿。',sp:{l:'ggNeutral',r:'fyWorry'}},
 {bg:'living',n:'Fy',x:'嗯。然后半夜两点来问我有没有吃的。',sp:{l:'ggSad',r:'fySmile'}},
 {bg:'living',n:'旁白',x:'Fy把面端到桌上。热气升起来，GG总算彻底清醒了一点。'},
 {bg:'living',n:'GG',x:'……好香。',sp:{l:'ggSmile',r:'fySmile'}},
 {bg:'living',n:'Fy',x:'慢点吃。烫。',sp:{l:'ggSmile',r:'fySmile'}},
 {bg:'living',n:'旁白',x:'这种对话已经发生过太多次，多到谁也没有觉得今天有什么特别。'},
 {t:'19:42 · 夜',n:'旁白',x:'晚上，两个人出了门。白天残留的热气慢慢散掉，路灯一盏接一盏亮起来。',sp:{}},
 {cg:'night',n:'Fy',x:'开学以后，别又为了成绩熬到凌晨。'},
 {cg:'night',n:'GG',x:'你怎么比我爸妈还啰嗦。'},
 {cg:'night',n:'Fy',x:'因为有人完全不会照顾自己。'},
 {cg:'night',n:'GG',x:'……知道了。'},
 {cg:'night',n:'旁白',x:'他们并肩往前走。谁也没有回头。'},
 {end:true}
];
let i=0,typing=false,timer=null,full='',skip=false;
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1100)}
function setBg(key){if(!key)return;const img=$('bg'),fb=$('bgFallback'),src=A.bg[key];fb.style.display='grid';fb.textContent=key==='room'?'GG 的房间':'客厅';img.style.opacity='0';img.onload=()=>{img.style.opacity='1';fb.style.display='none'};img.onerror=()=>{img.style.opacity='0';fb.style.display='grid'};img.src=src}
function hidePos(pos){const c=pos[0].toUpperCase()+pos.slice(1);$('sprite'+c).classList.add('hidden')}
function setSprite(pos,key){const c=pos[0].toUpperCase()+pos.slice(1),el=$('sprite'+c);if(!key){hidePos(pos);return}el.dataset.char=key.startsWith('fy')?'fy':'gg';el.classList.add('hidden');el.onload=()=>el.classList.remove('hidden');el.onerror=()=>el.classList.add('hidden');el.src=A.sp[key]}
function setSprites(m={}){setSprite('left',m.l);setSprite('center',m.c);setSprite('right',m.r)}
function type(s){clearInterval(timer);full=s;typing=true;$('dialogue').textContent='';if(skip){$('dialogue').textContent=s;typing=false;return}let p=0;timer=setInterval(()=>{p+=2;$('dialogue').textContent=s.slice(0,p);if(p>=s.length){clearInterval(timer);typing=false}},24)}
function finish(){if(!typing)return false;clearInterval(timer);$('dialogue').textContent=full;typing=false;return true}
function showCG(key){const layer=$('cg'),img=$('cgImage'),label=$('cgLabel');layer.classList.remove('hidden');label.style.display='none';img.style.display='block';img.onload=()=>{label.style.display='none';img.style.display='block'};img.onerror=()=>{img.style.display='none';label.style.display='block'};img.src='';requestAnimationFrame(()=>img.src=A.cg[key])}
function hideCG(){$('cg').classList.add('hidden')}
function render(){const s=story[i];if(!s)return;if(s.end){hideCG();setSprites({});$('endcard').classList.add('show');return}if(s.t)$('timecard').textContent=s.t;if(s.bg){hideCG();setBg(s.bg)}if(s.sp!==undefined)setSprites(s.sp);if(s.cg){setSprites({});showCG(s.cg)}$('name').textContent=s.n||'旁白';type(s.x||'')}
function next(){if($('endcard').classList.contains('show'))return;if(finish())return;i=Math.min(i+1,story.length-1);render()}
$('textbox').addEventListener('click',next);$('cg').addEventListener('click',next);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();next()}});
$('skipBtn').addEventListener('click',e=>{e.stopPropagation();skip=!skip;$('skipBtn').textContent=skip?'»»':'»';toast(skip?'快速文字：开':'快速文字：关')});
$('saveBtn').addEventListener('click',e=>{e.stopPropagation();localStorage.setItem('gg-fy-prologue-save',String(i));toast('已保存')});
$('restartBtn').addEventListener('click',()=>{i=0;$('endcard').classList.remove('show');hideCG();render()});
const saved=Number(localStorage.getItem('gg-fy-prologue-save'));if(Number.isInteger(saved)&&saved>0&&saved<story.length){i=saved;toast('发现存档，已从存档继续')}render();
})();
</script>
</body>
</html>
